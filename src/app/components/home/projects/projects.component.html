<section class="section projects-section" id="projects">
  <div class="container-fluid section-box">

    <div class="section-heading-row">
      <div>
        <h3 class="section-title">
          <span class="n-section-title">03. {{ title }}</span>
        </h3>

        <p class="section-subtitle" *ngIf="subtitle">
          {{ subtitle }}
        </p>
      </div>

      <div class="scroll-controls" aria-label="Project navigation">
        <button type="button" (click)="scroll(-1)" aria-label="Previous project">←</button>
        <button type="button" (click)="scroll(1)" aria-label="Next project">→</button>
      </div>
    </div>

    <div
      class="content-rail"
      #projectTrack
      tabindex="0"
      aria-label="Selected projects"
    >

      <article
        class="content-card"
        *ngFor="let project of projects"
      >

        <div class="project-heading">

          <div>
            <div class="card-header">
              <span class="card-type">{{ project.type }}</span>
              <span class="card-date" *ngIf="project.status">
                {{ project.status }}
              </span>
            </div>

            <h4>{{ project.title }}</h4>
          </div>

          <img
            *ngIf="project.image"
            class="project-thumbnail"
            [src]="project.image"
            [alt]="project.title"
            loading="lazy"
          />

        </div>

        <p class="problem" *ngIf="project.problem">
          {{ project.problem }}
        </p>

        <p class="summary">
          {{ project.summary }}
        </p>

        <ul class="highlights">
          <li *ngFor="let highlight of project.highlights | slice:0:4">
            {{ highlight }}
          </li>
        </ul>

        <div class="chips">
          <span *ngFor="let tech of project.technologies | slice:0:6">
            {{ tech }}
          </span>
        </div>

        <div
          class="card-links"
          *ngIf="project.githubUrl || project.demoUrl"
        >
          <a
            *ngIf="project.githubUrl"
            [href]="project.githubUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub ↗
          </a>

          <a
            *ngIf="project.demoUrl"
            [href]="project.demoUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            Live demo ↗
          </a>
        </div>

      </article>

    </div>

  </div>
</section>
