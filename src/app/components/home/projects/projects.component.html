<section class="section projects-section" id="projects">
  <div class="container-fluid section-box">

    <div class="section-heading-row">
      <div class="heading-copy">
        <h3 class="section-title">
          <span class="n-section-title"></span>
          {{ title }}
        </h3>

        <p class="section-subtitle" *ngIf="subtitle">
          {{ subtitle }}
        </p>
      </div>

      <div class="scroll-controls" aria-label="Project navigation">
        <button
          type="button"
          (click)="scroll(-1)"
          [disabled]="!canScroll(-1)"
          aria-label="Previous projects">
          ←
        </button>

        <button
          type="button"
          (click)="scroll(1)"
          [disabled]="!canScroll(1)"
          aria-label="Next projects">
          →
        </button>
      </div>
    </div>

    <div
      #projectTrack
      class="content-rail"
      tabindex="0"
      aria-label="Selected projects"
      (scroll)="updateActiveCards()">

      <article
        class="content-card"
        *ngFor="let project of projects; let i = index; trackBy: trackByProject"
        [class.is-active]="isCardInFocus(i)">

        <!-- Project title and status -->
        <div class="project-heading">
          <div class="project-heading-copy">
            <div class="card-header">
              <span class="card-type">
                {{ project.type }}
              </span>

              <span class="card-date" *ngIf="project.status">
                {{ formatStatus(project.status) }}
              </span>
            </div>

            <h3>{{ project.title }}</h3>
          </div>

          <img
            *ngIf="project.image"
            class="project-thumbnail"
            [src]="project.image"
            [alt]="project.title + ' preview'"
            loading="lazy">
        </div>

        <!-- Problem being solved -->
        <p class="problem" *ngIf="project.problem">
          {{ project.problem }}
        </p>

        <!-- Project summary -->
        <p class="summary" *ngIf="project.summary">
          {{ project.summary }}
        </p>

        <!-- Key highlights -->
        <ul class="highlights" *ngIf="project.highlights?.length">
          <li *ngFor="let highlight of project.highlights | slice:0:4">
            {{ highlight }}
          </li>
        </ul>

        <!-- Technologies -->
        <div class="chips" *ngIf="project.technologies?.length">
          <span *ngFor="let tech of project.technologies | slice:0:6">
            {{ tech }}
          </span>
        </div>

        <!-- Links and professional-project notice -->
        <div class="project-footer">
          <p
            class="confidentiality-note"
            *ngIf="project.confidentialityNote">
            {{ project.confidentialityNote }}
          </p>

          <div
            class="card-links"
            *ngIf="project.githubUrl || project.demoUrl">

            <a
              *ngIf="project.githubUrl"
              [href]="project.githubUrl"
              target="_blank"
              rel="noopener noreferrer">
              GitHub <span aria-hidden="true">↗</span>
            </a>

            <a
              *ngIf="project.demoUrl"
              [href]="project.demoUrl"
              target="_blank"
              rel="noopener noreferrer">
              Live demo <span aria-hidden="true">↗</span>
            </a>
          </div>
        </div>

      </article>

      <!-- Empty state if no visible projects are configured -->
      <p class="empty-state" *ngIf="projects.length === 0">
        Projects will appear here soon.
      </p>

    </div>
  </div>
</section>
