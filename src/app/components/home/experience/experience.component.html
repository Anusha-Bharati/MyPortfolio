<section class="section experience-section" id="experience">
  <div class="container-fluid section-box">

    <div class="section-heading-row">
      <h2 class="section-title">{{ title }}</h2>

      <div class="scroll-controls" aria-label="Experience navigation">
        <button
          type="button"
          (click)="scroll(-1)"
          [disabled]="!canScroll(-1)"
          aria-label="Previous experiences">
          ←
        </button>

        <button
          type="button"
          (click)="scroll(1)"
          [disabled]="!canScroll(1)"
          aria-label="Next experiences">
          →
        </button>
      </div>
    </div>

    <div
      #rail
      class="content-rail"
      (scroll)="updateActiveCards()">

      <article
        class="timeline-item"
        *ngFor="let item of experience; let i = index; trackBy: trackByExperience"
        [class.is-active]="isCardInFocus(i)">

        <!-- Timeline marker -->
        <div class="timeline-marker-row">
          <span class="timeline-marker" aria-hidden="true"></span>
        </div>

        <!-- Role, company and dates -->
        <header class="timeline-heading">
          <h3>{{ item.role }}</h3>

          <p class="timeline-company">
            {{ item.company }}
          </p>

          <p class="timeline-dates">
            {{ item.dateLabel }}
          </p>
        </header>

        <!-- Experience details -->
        <div
          class="experience-detail-box"
          [class.is-expanded]="expandedExperience.has(i)">

          <!-- Skills are ALWAYS visible at the top -->
          <div
            class="experience-chips"
            *ngIf="item.technologies?.length"
            aria-label="Technologies used">

            <span *ngFor="let technology of item.technologies">
              {{ technology }}
            </span>
          </div>

          <!-- Always show the full summary -->
          <p class="experience-summary">
            {{ item.summary }}
          </p>

          <!-- Achievement bullets appear only after See more -->
          <div
            class="experience-extra"
            *ngIf="expandedExperience.has(i)"
            [id]="'experience-extra-' + i">

            <ul *ngIf="item.highlights?.length">
              <li *ngFor="let highlight of item.highlights">
                {{ highlight }}
              </li>
            </ul>

          </div>

          <!-- Expand/collapse achievements -->
          <button
            *ngIf="item.highlights?.length"
            type="button"
            class="see-more"
            [attr.aria-expanded]="expandedExperience.has(i)"
            [attr.aria-controls]="'experience-extra-' + i"
            (click)="toggleExpanded(i)">

            {{ expandedExperience.has(i) ? 'See less ↑' : 'See more ↓' }}
          </button>

        </div>
      </article>

      <p class="empty-state" *ngIf="experience.length === 0">
        Experience details are currently unavailable.
      </p>

    </div>
  </div>
</section>
