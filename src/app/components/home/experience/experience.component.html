<section class="section experience-section" id="experience">
  <div class="container-fluid section-box">

    <div class="section-heading-row">
      <h3 class="section-title">
        <span class="n-section-title">02. {{ title }}</span>
      </h3>

      <div class="scroll-controls" aria-label="Experience navigation">
        <button type="button" (click)="scroll(-1)" aria-label="Previous experience">←</button>
        <button type="button" (click)="scroll(1)" aria-label="Next experience">→</button>
      </div>
    </div>

    <div
      class="content-rail"
      #experienceTrack
      tabindex="0"
      aria-label="Professional experience"
    >
      <article
        class="content-card"
        *ngFor="let item of experience; let i = index"
      >

        <div class="card-header">
          <span class="card-index">
            {{ (i + 1).toString().padStart(2, '0') }}
          </span>

          <span class="card-date">
            {{ item.dateLabel }}
          </span>
        </div>

        <h4>{{ item.role }}</h4>

        <a
          *ngIf="item.companyUrl; else companyText"
          [href]="item.companyUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="company"
        >
          {{ item.company }} ↗
        </a>

        <ng-template #companyText>
          <span class="company">{{ item.company }}</span>
        </ng-template>

        <p class="summary">
          {{ item.summary }}
        </p>

        <ul class="highlights">
          <li *ngFor="let highlight of item.highlights | slice:0:5">
            {{ highlight }}
          </li>
        </ul>

        <div class="chips">
          <span *ngFor="let tech of item.technologies | slice:0:6">
            {{ tech }}
          </span>
        </div>

      </article>
    </div>

  </div>
</section>
